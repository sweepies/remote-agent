name: deploy

"on":
  push:
    branches: [main]
  workflow_dispatch:

# Deploys are stateful (alchemy state store) and restart the box; never run
# two at once.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Installs bun + railway CLI from .mise.toml
      - uses: jdx/mise-action@v2

      - name: Install alchemy dependencies
        run: bun install

      - name: Check for active agent sessions
        id: guard
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          chmod +x scripts/deploy-guard.sh
          if ./scripts/deploy-guard.sh; then
            echo "busy=false" >> "$GITHUB_OUTPUT"
          else
            echo "busy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy with alchemy
        if: steps.guard.outputs.busy == 'false'
        env:
          CI: "true"
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          FNOX_AGE_KEY: ${{ secrets.FNOX_AGE_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun run deploy

      - name: Skipped (agents working)
        if: steps.guard.outputs.busy == 'true'
        run: 'echo "Deploy skipped: agent sessions are active on the box. Push again later or deploy manually."'
