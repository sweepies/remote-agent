name: deploy

"on":
  push:
    branches: [main]
  workflow_dispatch:

# Deploys are stateful (alchemy state store) and restart the box; never run
# two at once.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  # Railway + Cloudflare credentials come from the token broker (short-lived,
  # checked out per run via GitHub OIDC -> Pocket ID). FNOX_AGE_KEY is the
  # only static secret. The deploy-guard.sh busy check runs inside
  # `bun run deploy` so it sees the broker's RAILWAY_API_TOKEN; a busy box
  # (or guard failure) skips the deploy gracefully instead of failing.
  deploy:
    uses: sweepies/ops-workflows/.github/workflows/alchemy-deployer-broker-auth.yml@main
    with:
      deployment_profile: bun-fnox
    secrets:
      FNOX_AGE_KEY: ${{ secrets.FNOX_AGE_KEY }}
