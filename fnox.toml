#:schema https://fnox.jdx.dev/schema.json
default_provider = "age"

[providers.age]
type = "age"
recipients = ["age1ms3fkjx6u4866upenjjmm8zpxkjkdghms4glck50cd69drhgvfcqp29dug"]
key_file = "/home/agent/.config/fnox/age.txt"

[secrets]
GITHUB_TOKEN= { provider = "age", value = "", description = "GitHub PAT for sweepies (gh auth on the box)" }
TAILSCALE_AUTHKEY= { provider = "age", value = "", description = "Tailscale auth key for the remote-agent box (reusable, tagged tag:remote-agent)" }
TAILSCALE_VM_AUTHKEY= { provider = "age", value = "", description = "Tailscale auth key for test VMs (reusable, ephemeral, tagged tag:remote-agent); injected into VM user data at launch" }
# GITHUB_TOKEN: <redacted>
# GitHub device flow, for T3's Source Control `gh auth status` detection.
# Decrypted by fnox exec and persisted to gh's auth file at boot by
# entrypoint.sh (gh's file auth, since T3 ignores env-var tokens).
