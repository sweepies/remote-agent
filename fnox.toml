#:schema https://fnox.jdx.dev/schema.json
default_provider = "age"

[providers.age]
type = "age"
recipients = [
    "age1u3ajmcjmgdm3d9x9jeve8k0vxnpddzqyazf4s7hujfmfqv7grffq3t70ta", # sweepy
    "age1gknz0x48ksmlhwu0ckxtsmve979stw5w4nqs3cnjj4qdmhk0y9dqhq9mt9", # liv-agent
    "age1ms3fkjx6u4866upenjjmm8zpxkjkdghms4glck50cd69drhgvfcqp29dug", # remote-agent box
]

[secrets]
GITHUB_TOKEN= { provider = "age", value = "", description = "GitHub PAT for sweepies (gh auth on the box)" }
TAILSCALE_AUTHKEY= { provider = "age", value = "", description = "Tailscale auth key for the remote-agent box (reusable, tagged tag:remote-agent)" }
TAILSCALE_VM_AUTHKEY= { provider = "age", value = "", description = "Tailscale auth key for test VMs (reusable, ephemeral, tagged tag:remote-agent); injected into VM user data at launch" }
# GITHUB_TOKEN: <redacted>
# GitHub device flow, for T3's Source Control `gh auth status` detection.
# Decrypted by fnox exec and persisted to gh's auth file at boot by
# entrypoint.sh (gh's file auth, since T3 ignores env-var tokens).

# Short-lived AWS creds for test VMs. `fnox lease create aws` runs the
# `aws-creds` mise file task (.mise/tasks/aws-creds) and emits
# AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY / AWS_SESSION_TOKEN (+
# AWS_REGION). The daemon caches the lease until expires_at, then re-mints
# on the next request.
# Chain: tsiam JWT (5 min) -> Pocket ID OIDC (10 min, federated
# client_credentials for the remote-agent-aws client) -> STS
# AssumeRoleWithWebIdentity for role/remote-agent-test-vms (us-west-2 only,
# pinned to AMI ami-08205bb9c49ce7df5, resources tagged
# provisioned-by=remote-agent). No revocation: STS sessions just expire.
[leases.aws]
type = "command"
create_command = "mise run aws-creds"
duration = "1h"
timeout = "90s"
