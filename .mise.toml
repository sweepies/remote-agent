# All tools float on latest; the image picks up new versions on rebuild.
# (Renovate no longer manages this file: there is nothing pinned to bump.
# It still watches package.json for the alchemy deploy dependencies.)
# 1password-cli was already latest: it is not on GitHub so Renovate cannot
# track it, and mise pulls it from 1Password's own CDN.
[tools]
node = "latest"
fnox = "latest"
age = "latest"
pitchfork = "latest"
gh = "latest"
# codex floats on latest again: 0.159.1 aged past mise's minimum_release_age
# on Oct 7 2026 (latest resolves to 0.160.1, still >= 0.159.1 required by gpt-6.1-sol).
codex = "latest"
# pi: T3 nightly drives it as an agent provider via RPC mode
# (pi --mode rpc). Installed via the npm backend per AGENTS.md.
"npm:@earendil-works/pi-coding-agent" = "latest"
"1password-cli" = "latest"
entire = "latest"
bun = "latest"
railway = "latest"
nushell = "latest"
xh = "latest"
"aws-cli" = "latest"
