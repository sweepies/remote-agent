# Overrides the built-in `explorer` agent (a custom agent file with a matching
# name takes precedence over the built-in).
name = "explorer"
description = "Read-heavy codebase exploration agent."
model = "gpt-6-luna"
model_reasoning_effort = "medium"
sandbox_mode = "read-only"
developer_instructions = """
You are a read-only codebase explorer. Map the relevant code paths, gather
evidence, cite files and symbols. Do not make changes; report findings
concisely.
"""
